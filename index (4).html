@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a19;--surf:#152524;--ink:#e3efec;--mute:#93aaa6;--line:#243836;--wash:15,29,51;--side:#0f1d33;--sideink:#b9cdee;--sidehi:#fff;--sideline:rgba(255,255,255,.3);--sidehover:rgba(255,255,255,.08);--acc:#6ea2f2;--acc-ink:#0a1312;--soft:#1b3a2c;--softink:#8fd8b0;--warn:#3d3112;--warnink:#f0c86a;--bad:#401d1d;--badink:#f4a3a3;--blue:#1c2e4d;--blueink:#a9c6f5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1a19;--surf:#152524;--ink:#e3efec;--mute:#93aaa6;--line:#243836;--wash:15,29,51;--side:#0f1d33;--sideink:#b9cdee;--sidehi:#fff;--sideline:rgba(255,255,255,.3);--sidehover:rgba(255,255,255,.08);--acc:#6ea2f2;--acc-ink:#0a1312;--soft:#1b3a2c;--softink:#8fd8b0;--warn:#3d3112;--warnink:#f0c86a;--bad:#401d1d;--badink:#f4a3a3;--blue:#1c2e4d;--blueink:#a9c6f5;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;font-weight:600;margin:0}
h1{font-size:28px}h2{font-size:19px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--side) var(--cover) no-repeat 72% 40%/cover;isolation:isolate;color:var(--sideink);padding:22px 14px;position:sticky;top:0;height:100vh}
nav .brand{font-family:"Source Serif 4",Georgia,serif;font-size:19px;color:var(--sidehi);padding:0 10px 18px}
nav .brand small{display:block;font:12px Figtree,sans-serif;color:var(--sideink);opacity:.75}
nav a{display:block;padding:9px 12px;border-radius:8px;color:inherit;text-decoration:none;margin-bottom:2px}
nav a:hover{background:var(--sidehover)}
nav a.on{background:var(--surf);color:var(--sidehi);font-weight:600}
nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{padding:26px 30px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top p{margin:2px 0 0;color:var(--mute)}
.banner{background:var(--warn);color:var(--warnink);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:14px}
.stat b{display:block;font:600 26px "Source Serif 4",Georgia,serif}
.stat span{color:var(--mute);font-size:13px}
.grid2{display:grid;grid-template-columns:3fr 2fr;gap:16px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h2{margin-bottom:10px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:500;font-size:13px}
tr:last-child td{border-bottom:0}
td a{color:var(--acc);text-decoration:none;font-weight:600}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.Pending,.Unpaid{background:var(--warn);color:var(--warnink)}
.Confirmed,.Partial{background:var(--blue);color:var(--blueink)}
.Completed,.Paid{background:var(--soft);color:var(--softink)}
.Cancelled{background:var(--bad);color:var(--badink)}
button,.btn{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--surf);color:var(--ink);padding:7px 13px;cursor:pointer}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
button.sm{padding:3px 9px;font-size:13px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:10px}
label input,label select,label textarea{margin-top:3px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.row input,.row select{width:auto;flex:1;min-width:140px}
.err{color:var(--badink);font-size:13px;min-height:18px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surf);color:var(--ink);width:min(480px,92vw);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--mute)}
.bars i{display:block;background:var(--acc);border-radius:4px 4px 0 0;margin-bottom:4px}
.visit{border-left:3px solid var(--acc);padding:2px 0 2px 12px;margin-bottom:14px}
.visit small{color:var(--mute)}
.empty{color:var(--mute);padding:14px 0}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.meta div{font-size:13px;color:var(--mute)}.meta b{display:block;color:var(--ink);font-size:15px}
@media (max-width:820px){
.app{grid-template-columns:1fr}
nav{position:sticky;top:env(safe-area-inset-top,0px);height:auto;display:flex;gap:4px;overflow-x:auto;padding:10px;z-index:5}
nav .brand{display:none}nav a{white-space:nowrap;margin:0}
main{padding:18px 14px}.grid2{grid-template-columns:1fr}}
@media print{nav,.noprint,.banner{display:none!important}.app{display:block}body{background:#fff;color:#000}}
[hidden]{display:none!important}
.split{display:grid;grid-template-columns:1.05fr 1fr;min-height:100vh}
.hero{background:#eef3f2 var(--cover) no-repeat 70% center/cover;color:#12305c;position:relative;isolation:isolate;padding:40px 48px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.hero .logo{font:600 20px "Source Serif 4",Georgia,serif}
.hero h1{font-size:34px;line-height:1.2;max-width:440px;margin-bottom:12px}
.hero p{margin:0;max-width:380px;opacity:.85}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(226,238,252,.95) 0%,rgba(226,238,252,.72) 42%,rgba(226,238,252,0) 72%),rgba(48,110,205,.2)}
.hero .logo{color:#1f4f9c}
.hero small{background:rgba(236,244,254,.92);color:#12305c;padding:6px 10px;border-radius:6px;align-self:flex-start;opacity:1}
.panel{display:flex;align-items:center;justify-content:center;padding:32px 20px}
.panel form{width:min(380px,100%)}
.panel .sub{color:var(--mute);margin:4px 0 20px}
.wide{width:100%;margin-top:8px;padding:10px 13px}
.hint{color:var(--mute);font-size:13px;margin-top:16px}
nav .who{padding:18px 10px 0;font-size:13px;color:var(--sideink)}nav .who b{display:block;color:var(--sidehi);font-size:14px}
nav button{background:transparent;color:inherit;border-color:var(--sideline);width:100%;margin-top:10px}
@media (max-width:820px){.split{grid-template-columns:1fr}.hero{padding:24px 20px;gap:16px}.hero h1{font-size:24px}nav .who{display:none}nav button{width:auto;margin:0;white-space:nowrap}}
@media (max-width:820px){.hero{min-height:300px;background-position:78% 25%}}
nav::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(var(--wash),.94) 0%,rgba(var(--wash),.8) 45%,rgba(var(--wash),0) 90%),rgba(48,110,205,.16)}
@media (max-width:820px){nav{background:var(--side)}nav::before{display:none}}
</style>
</head>
<body>
<div id="auth" hidden></div>
<div class="app" hidden>
<nav aria-label="Main">
<div class="brand">Dr. MH Niloy’s Clinic<small>Practice manager</small></div>
<a href="#dashboard" data-r="dashboard">Dashboard</a>
<a href="#patients" data-r="patients">Patients</a>
<a href="#appointments" data-r="appointments">Appointments</a>
<a href="#archive" data-r="archive">Archive</a>
<a href="#billing" data-r="billing">Billing</a>
<div class="who" id="who"></div><button id="out">Sign out</button>
</nav>
<main id="view"></main>
</div>
<dialog id="dlg"></dialog>
<script>
const KEY="clinic-proto-v1";
const iso=d=>{const t=new Date(d);return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")};
const off=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const TODAY=off(0);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>"€"+Number(n).toFixed(2);
const $=s=>document.querySelector(s);
function seed(){
return{
doctors:[{id:"D1",name:"Dr. MH Niloy",spec:"General practice"},{id:"D2",name:"Dr. Marek Svoboda",spec:"Cardiology"},{id:"D3",name:"Dr. Aisha Rahman",spec:"Paediatrics"}],
patients:[
{id:"P-1001",name:"Jana Procházková",dob:"1984-03-12",phone:"+420 601 112 233",allergies:"Penicillin",visits:[{date:off(-40),did:"D1",symptoms:"Persistent cough, mild fever",diagnosis:"Acute bronchitis",rx:"Ambroxol 30 mg, 3× daily for 7 days"}]},
{id:"P-1002",name:"Tomáš Horák",dob:"1971-11-02",phone:"+420 602 445 100",allergies:"None recorded",visits:[{date:off(-12),did:"D2",symptoms:"Chest tightness on exertion",diagnosis:"Stable angina, further tests ordered",rx:"Aspirin 100 mg daily"}]},
{id:"P-1003",name:"Lucie Králová",dob:"2018-06-21",phone:"+420 603 778 910",allergies:"Peanuts",visits:[]},
{id:"P-1004",name:"Petr Veselý",dob:"1959-01-30",phone:"+420 604 300 421",allergies:"None recorded",visits:[{date:off(-5),did:"D1",symptoms:"Elevated blood pressure at home",diagnosis:"Hypertension, grade 1",rx:"Review in 4 weeks, reduce salt"}]},
{id:"P-1005",name:"Anna Dvořáková",dob:"1992-09-08",phone:"+420 605 884 002",allergies:"Latex",visits:[]}],
appts:[
{id:"A1",pid:"P-1001",did:"D1",date:TODAY,time:"09:00",reason:"Follow-up",status:"Confirmed"},
{id:"A2",pid:"P-1002",did:"D2",date:TODAY,time:"10:30",reason:"Stress test results",status:"Pending"},
{id:"A3",pid:"P-1003",did:"D3",date:TODAY,time:"11:15",reason:"Vaccination",status:"Confirmed"},
{id:"A4",pid:"P-1004",did:"D1",date:TODAY,time:"14:00",reason:"Blood pressure review",status:"Completed"},
{id:"A5",pid:"P-1005",did:"D1",date:off(1),time:"09:30",reason:"General check-up",status:"Pending"},
{id:"A6",pid:"P-1002",did:"D2",date:off(3),time:"13:00",reason:"ECG",status:"Confirmed"},
{id:"A7",pid:"P-1001",did:"D1",date:off(-2),time:"15:00",reason:"Lab results",status:"Cancelled"}],
inv:[
{no:"INV-0001",pid:"P-1001",did:"D1",date:off(-40),amount:45,paid:45,method:"Card"},
{no:"INV-0002",pid:"P-1002",did:"D2",date:off(-12),amount:120,paid:60,method:"Bank transfer"},
{no:"INV-0003",pid:"P-1004",did:"D1",date:off(-5),amount:45,paid:45,method:"Cash"},
{no:"INV-0004",pid:"P-1004",did:"D1",date:TODAY,amount:45,paid:0,method:""},
{no:"INV-0005",pid:"P-1003",did:"D3",date:off(-3),amount:35,paid:35,method:"Card"}]};
}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.patients)S=seed();
S.docs=S.docs||[];
const LOCS=["Savar clinic","Enam clinic","Private chamber"];
S.appts.forEach((a,i)=>{if(!a.loc)a.loc=LOCS[i%3]});
if(!S.doctors.some(d=>d.id==="D4"))S.doctors.push({id:"D4",name:"Dr. Maria Tanin",spec:"Internal medicine"});
if(!S.appts.some(a=>a.id==="A8"))S.appts.push({id:"A8",pid:"P-1005",did:"D4",loc:"Enam clinic",date:TODAY,time:"12:00",reason:"Follow-up visit",status:"Pending"},{id:"A9",pid:"P-1003",did:"D4",loc:"Private chamber",date:off(2),time:"10:00",reason:"General consultation",status:"Confirmed"});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const P=id=>S.patients.find(p=>p.id===id)||{name:"Unknown"};
const D=id=>S.doctors.find(d=>d.id===id)||{name:"Unknown"};
const status=i=>i.paid>=i.amount?"Paid":i.paid>0?"Partial":"Unpaid";
const opts=(arr,k,v,sel)=>arr.map(x=>`<option value="${esc(x[k])}"${x[k]===sel?" selected":""}>${esc(typeof v==="function"?v(x):x[v])}</option>`).join("");
let q="";

function dlg(title,body,onOk,okLabel){
const d=$("#dlg");
d.innerHTML=`<h2>${title}</h2><div style="height:10px"></div><form method="dialog" id="f">${body}<div class="err" id="err"></div><div class="acts"><button type="button" id="x">Cancel</button><button class="pri">${okLabel}</button></div></form>`;
$("#x").onclick=()=>d.close();
$("#f").onsubmit=e=>{e.preventDefault();const fd=Object.fromEntries(new FormData(e.target));const m=onOk(fd);if(m){$("#err").textContent=m;return}d.close();save();render()};
d.showModal();
}

function dashboard(){
const td=S.appts.filter(a=>a.date===TODAY).sort((a,b)=>a.time.localeCompare(b.time));
const due=S.inv.reduce((s,i)=>s+i.amount-i.paid,0);
const mon=TODAY.slice(0,7);
const rev=S.inv.filter(i=>i.date.startsWith(mon)).reduce((s,i)=>s+i.paid,0);
const days=[...Array(7)].map((_,k)=>off(k-6));
const vals=days.map(d=>S.inv.filter(i=>i.date===d).reduce((s,i)=>s+i.paid,0));
const mx=Math.max(...vals,1);
return`<div class="top"><div><h1>Good day, ${esc(user.name)}</h1><p>${new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</p></div></div>
<div class="stats"><div class="stat"><b>${S.patients.length}</b><span>Registered patients</span></div><div class="stat"><b>${td.length}</b><span>Appointments today</span></div><div class="stat"><b>${S.doctors.length}</b><span>Doctors on staff</span></div><div class="stat"><b>${money(rev)}</b><span>Collected this month</span></div><div class="stat"><b>${money(due)}</b><span>Outstanding</span></div></div>
<div class="grid2"><div class="card"><h2>Today’s appointments</h2>${td.length?`<div class="scroll"><table><tr><th>Time</th><th>Patient</th><th>Doctor</th><th>Place</th><th>Status</th></tr>${td.map(a=>`<tr><td>${a.time}</td><td><a href="#patient-${a.pid.slice(2)}">${esc(P(a.pid).name)}</a></td><td>${esc(D(a.did).name)}</td><td>${esc(a.loc)}</td><td><span class="tag ${a.status}">${a.status}</span></td></tr>`).join("")}</table></div>`:`<p class="empty">No appointments today. Book one from the Appointments page.</p>`}</div>
<div class="card"><h2>Collected, last 7 days</h2><div class="bars">${vals.map((v,k)=>`<div title="${money(v)}"><i style="height:${Math.round(v/mx*100)}px;min-height:2px"></i>${days[k].slice(8)}</div>`).join("")}</div></div></div>`;
}

function patients(){
return`<div class="top"><div><h1>Patients</h1><p>Search by ID, name or phone.</p></div><button class="pri" onclick="newPatient()">Register patient</button></div>
<div class="row"><input id="q" type="search" placeholder="Search patients" value="${esc(q)}" aria-label="Search patients" oninput="q=this.value;$('#pl').innerHTML=prows()"></div>
<div class="card scroll"><table><thead><tr><th>ID</th><th>Name</th><th>Date of birth</th><th>Phone</th><th>Last visit</th></tr></thead><tbody id="pl">${prows()}</tbody></table></div>`;
}
function prows(){
const t=q.trim().toLowerCase();
const r=S.patients.filter(p=>!t||[p.id,p.name,p.phone].some(x=>x.toLowerCase().includes(t)));
if(!r.length)return`<tr><td colspan="5" class="empty">No patient matches “${esc(q)}”. Check the spelling or register a new patient.</td></tr>`;
return r.map(p=>{const v=p.visits.at(-1);return`<tr><td>${p.id}</td><td><a href="#patient-${p.id.slice(2)}">${esc(p.name)}</a></td><td>${p.dob}</td><td>${esc(p.phone)}</td><td>${v?v.date:"No visits yet"}</td></tr>`}).join("");
}
function newPatient(){
dlg("Register patient",`<label>Full name<input name="name" required></label><label>Date of birth<input name="dob" type="date" required max="${TODAY}"></label><label>Phone<input name="phone" required placeholder="+420 …"></label><label>Allergies<input name="allergies" placeholder="None recorded"></label>`,f=>{
if(f.name.trim().length<3)return"Enter the patient’s full name.";
if(!/^[+\d][\d\s]{6,}$/.test(f.phone.trim()))return"Enter a phone number with at least 7 digits.";
const n=Math.max(1000,...S.patients.map(p=>+p.id.slice(2)))+1;
S.patients.push({id:"P-"+n,name:f.name.trim(),dob:f.dob,phone:f.phone.trim(),allergies:f.allergies.trim()||"None recorded",visits:[]});
},"Register");
}

function patient(num){
const p=S.patients.find(x=>x.id==="P-"+num);
if(!p)return`<p class="empty">Patient not found. <a href="#patients">Back to patients</a></p>`;
const inv=S.inv.filter(i=>i.pid===p.id);
const vis=[...p.visits].sort((a,b)=>b.date.localeCompare(a.date));
return`<div class="top"><div><h1>${esc(p.name)}</h1><p>${p.id}</p></div><div class="noprint row"><button onclick="print()">Print record</button><button class="pri" onclick="newVisit('${p.id}')">Add visit note</button></div></div>
<div class="card"><div class="meta"><div>Date of birth<b>${p.dob}</b></div><div>Phone<b>${esc(p.phone)}</b></div><div>Allergies<b>${esc(p.allergies)}</b></div><div>Open balance<b>${money(inv.reduce((s,i)=>s+i.amount-i.paid,0))}</b></div></div></div>
<div class="grid2" style="margin-top:16px"><div class="card"><h2>Visit history</h2>${vis.length?vis.map(v=>`<div class="visit"><b>${v.date}</b> <small>${esc(D(v.did).name)}</small><br><b>Symptoms:</b> ${esc(v.symptoms)}<br><b>Diagnosis:</b> ${esc(v.diagnosis)}<br><b>Prescription:</b> ${esc(v.rx||"None")}</div>`).join(""):`<p class="empty">No visits recorded. Add the first visit note.</p>`}</div>
<div class="card"><h2>Invoices</h2>${inv.length?`<table>${inv.map(i=>`<tr><td>${i.no}</td><td>${money(i.amount)}</td><td><span class="tag ${status(i)}">${status(i)}</span></td></tr>`).join("")}</table>`:`<p class="empty">No invoices yet.</p>`}</div></div>
<div class="card" style="margin-top:16px"><div class="row" style="justify-content:space-between;margin-bottom:6px"><h2 style="margin:0">Documents</h2><button class="noprint" onclick="upload('${p.id}')">Upload document</button></div>${docTable(S.docs.filter(d=>d.pid===p.id),false)}</div>`;
}
function newVisit(pid){
dlg("Add visit note",`<label>Doctor<select name="did">${opts(S.doctors,"id","name")}</select></label><label>Symptoms<textarea name="symptoms" rows="2" required></textarea></label><label>Diagnosis<textarea name="diagnosis" rows="2" required></textarea></label><label>Prescription and plan<textarea name="rx" rows="2"></textarea></label><label>Consultation fee (€, optional)<input name="fee" type="number" min="0" step="0.01"></label>`,f=>{
const p=P(pid);
p.visits.push({date:TODAY,did:f.did,symptoms:f.symptoms.trim(),diagnosis:f.diagnosis.trim(),rx:f.rx.trim()});
if(+f.fee>0)S.inv.push({no:nextInv(),pid,did:f.did,date:TODAY,amount:+f.fee,paid:0,method:""});
},"Save note");
}

function appointments(){
const st=window.fs||"All",dc=window.fd||"All",lc=window.fl||"All";
const r=S.appts.filter(a=>(st==="All"||a.status===st)&&(dc==="All"||a.did===dc)&&(lc==="All"||a.loc===lc)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
return`<div class="top"><div><h1>Appointments</h1><p>${S.appts.length} booked in total</p></div><button class="pri" onclick="newAppt()">Book appointment</button></div>
<div class="row"><select aria-label="Filter by status" onchange="fs=this.value;render()">${["All","Pending","Confirmed","Completed","Cancelled"].map(s=>`<option${s===st?" selected":""}>${s}</option>`).join("")}</select><select aria-label="Filter by doctor" onchange="fd=this.value;render()"><option value="All">All</option>${opts(S.doctors,"id","name",dc)}</select><select aria-label="Filter by place" onchange="fl=this.value;render()">${["All",...LOCS].map(c=>`<option${c===lc?" selected":""}>${c}</option>`).join("")}</select></div>
<div class="card scroll">${r.length?`<table><tr><th>Date</th><th>Time</th><th>Patient</th><th>Doctor</th><th>Place</th><th>Reason</th><th>Status</th></tr>${r.map(a=>`<tr><td>${a.date}</td><td>${a.time}</td><td><a href="#patient-${a.pid.slice(2)}">${esc(P(a.pid).name)}</a></td><td>${esc(D(a.did).name)}</td><td>${esc(a.loc)}</td><td>${esc(a.reason)}</td><td><select class="sm" aria-label="Status" style="width:auto;padding:3px 6px" onchange="setStatus('${a.id}',this.value)">${["Pending","Confirmed","Completed","Cancelled"].map(s=>`<option${s===a.status?" selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("")}</table>`:`<p class="empty">No appointments match these filters.</p>`}</div>`;
}
function setStatus(id,v){S.appts.find(a=>a.id===id).status=v;save();render()}
function newAppt(){
dlg("Book appointment",`<label>Patient<select name="pid">${opts(S.patients,"id",p=>p.id+" – "+p.name)}</select></label><label>Doctor<select name="did">${opts(S.doctors,"id",d=>d.name+" ("+d.spec+")")}</select></label><label>Place<select name="loc">${LOCS.map(c=>`<option>${c}</option>`).join("")}</select></label><label>Date<input name="date" type="date" min="${TODAY}" value="${TODAY}" required></label><label>Time<input name="time" type="time" min="08:00" max="17:30" required></label><label>Reason<input name="reason" required></label>`,f=>{
if(f.date<TODAY)return"Choose today or a later date.";
if(f.time<"08:00"||f.time>"17:30")return"Clinic hours are 08:00 to 17:30.";
if(S.appts.some(a=>a.did===f.did&&a.date===f.date&&a.time===f.time&&a.status!=="Cancelled"))return"That doctor already has an appointment at this time. Pick another slot.";
S.appts.push({id:"A"+Date.now(),pid:f.pid,did:f.did,loc:f.loc,date:f.date,time:f.time,reason:f.reason.trim(),status:"Pending"});
},"Book");
}

const nextInv=()=>"INV-"+String(S.inv.length+1).padStart(4,"0");
function billing(){
const tot=S.inv.reduce((s,i)=>s+i.amount,0),pd=S.inv.reduce((s,i)=>s+i.paid,0);
const r=[...S.inv].sort((a,b)=>b.date.localeCompare(a.date));
return`<div class="top"><div><h1>Billing</h1><p>Invoices and payments</p></div><button class="pri" onclick="newInv()">Create invoice</button></div>
<div class="stats"><div class="stat"><b>${money(tot)}</b><span>Invoiced</span></div><div class="stat"><b>${money(pd)}</b><span>Collected</span></div><div class="stat"><b>${money(tot-pd)}</b><span>Outstanding</span></div></div>
<div class="card scroll"><table><tr><th>Invoice</th><th>Date</th><th>Patient</th><th>Doctor</th><th>Amount</th><th>Paid</th><th>Status</th><th></th></tr>${r.map(i=>`<tr><td>${i.no}</td><td>${i.date}</td><td>${esc(P(i.pid).name)}</td><td>${esc(D(i.did).name)}</td><td>${money(i.amount)}</td><td>${money(i.paid)}</td><td><span class="tag ${status(i)}">${status(i)}</span></td><td>${i.paid<i.amount?`<button class="sm" onclick="pay('${i.no}')">Record payment</button>`:""}</td></tr>`).join("")}</table></div>`;
}
function newInv(){
dlg("Create invoice",`<label>Patient<select name="pid">${opts(S.patients,"id",p=>p.id+" – "+p.name)}</select></label><label>Doctor<select name="did">${opts(S.doctors,"id","name")}</select></label><label>Amount (€)<input name="amount" type="number" min="1" step="0.01" required></label>`,f=>{
if(!(+f.amount>0))return"Enter an amount greater than zero.";
S.inv.push({no:nextInv(),pid:f.pid,did:f.did,date:TODAY,amount:+f.amount,paid:0,method:""});
},"Create");
}
function pay(no){
const i=S.inv.find(x=>x.no===no),left=i.amount-i.paid;
dlg("Record payment for "+no,`<p style="margin-top:0">Balance due: <b>${money(left)}</b></p><label>Amount (€)<input name="amt" type="number" step="0.01" value="${left.toFixed(2)}" required></label><label>Method<select name="m"><option>Cash</option><option>Card</option><option>Bank transfer</option><option>Other</option></select></label>`,f=>{
if(!(+f.amt>0)||+f.amt>left+0.001)return"Enter an amount between 0.01 and "+left.toFixed(2)+".";
i.paid=Math.round((i.paid+ +f.amt)*100)/100;i.method=f.m;
},"Record payment");
}

const ACC=[{email:"owner@niloyclinic.demo",pw:"demo1234",name:"Dr. MH Niloy",role:"Clinic owner"},{email:"maria@niloyclinic.demo",pw:"demo1234",name:"Dr. Maria Tanin",role:"Doctor"},{email:"reception@niloyclinic.demo",pw:"demo1234",name:"Klára Beneš",role:"Receptionist"}];
let user=null;try{user=JSON.parse(sessionStorage.getItem("clinic-user"))}catch(e){}
function login(){return`<div class="split"><section class="hero"><div class="logo">Dr. MH Niloy’s Clinic</div><div><h1>Patients, appointments and billing in one place.</h1><p>Sign in to see today’s schedule and open patient records.</p></div><small>Prototype with demo data. This sign-in is not real authentication.</small></section><section class="panel"><form id="lf" novalidate><h2>Sign in</h2><p class="sub">Use your clinic account.</p><label>Email<input name="email" type="email" autocomplete="username"></label><label>Password<input name="pw" type="password" autocomplete="current-password"></label><div class="err" id="lerr" role="alert"></div><button class="pri wide">Sign in</button><button type="button" class="wide" id="demo">Fill demo owner login</button><p class="hint">Demo accounts: owner@niloyclinic.demo, maria@niloyclinic.demo or reception@niloyclinic.demo, password demo1234.</p></form></section></div>`}
function bindLogin(){
$("#demo").onclick=()=>{const f=$("#lf");f.email.value=ACC[0].email;f.pw.value=ACC[0].pw;$("#lerr").textContent=""};
$("#lf").onsubmit=e=>{e.preventDefault();const f=e.target,em=f.email.value.trim().toLowerCase();
if(!/^\S+@\S+\.\S+$/.test(em))return $("#lerr").textContent="Enter a valid email address.";
if(!f.pw.value)return $("#lerr").textContent="Enter your password.";
const a=ACC.find(x=>x.email===em&&x.pw===f.pw.value);
if(!a)return $("#lerr").textContent="Email or password is incorrect. Use a demo account listed below.";
user={name:a.name,role:a.role};try{sessionStorage.setItem("clinic-user",JSON.stringify(user))}catch(x){}
render()}}
$("#out").onclick=()=>{user=null;try{sessionStorage.removeItem("clinic-user")}catch(e){}render()};
const CATS=["Lab report","Imaging","Prescription","Referral letter","Consent form","Other"];
const kb=n=>n<1024?n+" B":n<1048576?Math.round(n/1024)+" KB":(n/1048576).toFixed(1)+" MB";
const af={q:"",c:"All"};
function msg(t,m){const d=$("#dlg");d.innerHTML=`<h2>${t}</h2><p>${m}</p><div class="acts"><button onclick="$('#dlg').close()">Close</button></div>`;d.showModal()}
function adocs(){const t=af.q.trim().toLowerCase();return S.docs.filter(d=>(af.c==="All"||d.cat===af.c)&&(!t||[d.name,d.note||"",d.pid,P(d.pid).name].some(x=>x.toLowerCase().includes(t)))).sort((a,b)=>b.date.localeCompare(a.date))}
const isImg=n=>/\.(png|jpe?g|webp|gif)$/i.test(n);
function docTable(r,showP){
if(!r.length)return`<p class="empty">No documents stored. Upload a report, scan or letter.</p>`;
return`<div class="scroll"><table><tr><th>Document</th>${showP?"<th>Patient</th>":""}<th>Category</th><th>Added</th><th>Size</th><th></th></tr>${r.map(d=>`<tr><td>${esc(d.name)}${d.note?`<br><small style="color:var(--mute)">${esc(d.note)}</small>`:""}</td>${showP?`<td><a href="#patient-${d.pid.slice(2)}">${esc(P(d.pid).name)}</a></td>`:""}<td>${esc(d.cat)}</td><td>${d.date}</td><td>${kb(d.size)}</td><td>${isImg(d.name)?`<button class="sm" onclick="viewDoc('${d.id}')">View</button> `:""}<button class="sm" onclick="dlDoc('${d.id}')">Download</button> <button class="sm" onclick="delDoc('${d.id}')">Delete</button></td></tr>`).join("")}</table></div>`}
function archive(){
const used=S.docs.reduce((s,d)=>s+d.size,0);
return`<div class="top"><div><h1>Archive</h1><p>Reports, scans and letters filed by patient.</p></div><button class="pri" onclick="upload()">Upload document</button></div>
<div class="stats"><div class="stat"><b>${S.docs.length}</b><span>Documents stored</span></div><div class="stat"><b>${kb(used)}</b><span>Space used in this browser</span></div></div>
<div class="row"><input type="search" placeholder="Search by file, patient or note" value="${esc(af.q)}" aria-label="Search documents" oninput="af.q=this.value;$('#dl').innerHTML=docTable(adocs(),true)"><select aria-label="Filter by category" onchange="af.c=this.value;render()">${["All",...CATS].map(c=>`<option${c===af.c?" selected":""}>${c}</option>`).join("")}</select></div>
<div class="card" id="dl">${docTable(adocs(),true)}</div>`}
function upload(pid){
dlg("Upload document",`<label>Patient<select name="pid">${opts(S.patients,"id",p=>p.id+" – "+p.name,pid)}</select></label><label>Category<select name="cat">${CATS.map(c=>`<option>${c}</option>`).join("")}</select></label><label>File (PDF, image, text, Word, Excel or CSV, up to 1 MB)<input name="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.gif,.txt,.docx,.xlsx,.csv"></label><label>Note (optional)<input name="note"></label>`,f=>{
const file=f.file;
if(!file||!file.size)return"Choose a file to upload.";
if(!/\.(pdf|png|jpe?g|webp|gif|txt|docx|xlsx|csv)$/i.test(file.name))return"This file type is not supported. Use PDF, image, text, Word, Excel or CSV.";
if(file.size>1048576)return"This file is over 1 MB. Compress it first. This demo keeps files in your browser.";
const id="F"+Date.now(),rd=new FileReader();
rd.onload=()=>{try{localStorage.setItem("clinic-file-"+id,rd.result)}catch(e){msg("Storage is full","Delete a stored document and try again.");return}
S.docs.push({id,pid:f.pid,cat:f.cat,name:file.name,size:file.size,date:TODAY,by:user.name,note:f.note.trim()});save();render()};
rd.readAsDataURL(file)},"Upload");
}
function toBlob(u){const[h,b]=u.split(","),m=h.match(/:(.*?);/)[1],bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m})}
function viewDoc(id){const d=S.docs.find(x=>x.id===id),u=localStorage.getItem("clinic-file-"+id);if(!u)return msg("File not found","This file is no longer stored in this browser.");
const el=$("#dlg");el.innerHTML=`<h2>${esc(d.name)}</h2><img alt="${esc(d.name)}" style="max-width:100%;border-radius:8px;margin:12px 0" src="${u}"><div class="acts"><button onclick="$('#dlg').close()">Close</button></div>`;el.showModal()}
async function dlDoc(id){
const d=S.docs.find(x=>x.id===id),u=localStorage.getItem("clinic-file-"+id);
if(!u)return msg("File not found","This file is no longer stored in this browser.");
let dl=null;try{dl=await window.claude.use("downloads")}catch(e){}
if(!dl){const a=document.createElement("a");a.href=URL.createObjectURL(toBlob(u));a.download=d.name;document.body.appendChild(a);a.click();a.remove();return}
try{await dl.save({filename:d.name,data:toBlob(u)})}catch(e){if(!e||e.code!=="declined")msg("Could not save the file","Try again in a moment.")}}
function delDoc(id){const d=S.docs.find(x=>x.id===id);
dlg("Delete document",`<p style="margin-top:0">Delete “${esc(d.name)}” for ${esc(P(d.pid).name)}? This cannot be undone.</p>`,()=>{S.docs=S.docs.filter(x=>x.id!==id);try{localStorage.removeItem("clinic-file-"+id)}catch(e){}},"Delete")}
function render(){
$("#auth").hidden=!!user;document.querySelector(".app").hidden=!user;
if(!user){$("#auth").innerHTML=login();bindLogin();return}
{const a=ACC.find(x=>x.role===user.role);if(a){user.name=a.name;try{sessionStorage.setItem("clinic-user",JSON.stringify(user))}catch(e){}}}
$("#who").innerHTML=`<b>${esc(user.name)}</b>${esc(user.role)}`;
const h=location.hash.slice(1)||"dashboard";
const r=h.startsWith("patient-")?"patients":h;
document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.r===r));
const bn=`<div class="banner">Demo data only. This prototype stores everything in your browser, with no real login or access control. Do not enter real patient information.</div>`;
let v;
if(h.startsWith("patient-"))v=patient(h.slice(8));
else v=({dashboard,patients,appointments,archive,billing}[h]||dashboard)();
$("#view").innerHTML=bn+v;
}
addEventListener("hashchange",()=>{q="";render();scrollTo(0,0)});
render();
